<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Project</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="calcutor_div">
        <!-- input + clear button starts-->
        <div class="inputBox_clearBtn">
            <div>
                <input type="text" name="input_box" id="input_box" placeholder="Enter numbers" readonly>
            </div>
            <button onclick="clearInput()">
                C
            </button>
        </div>
        <!-- input + clear button ends-->
        <!-- 1st row button starts-->
        <div class="cal_buttons">
            <button onclick="handleShowInput('1')">1</button>
            <button onclick="handleShowInput('2')">2</button>
            <button onclick="handleShowInput('3')">3</button>
            <button onclick="handleShowInput('/')">/</button>
        </div>
        <!-- 1st row button ends-->
        <!-- 2nd row button starts-->
        <div class="cal_buttons">
            <button onclick="handleShowInput('4')">4</button>
            <button onclick="handleShowInput('5')">5</button>
            <button onclick="handleShowInput('6')">6</button>
            <button onclick="handleShowInput('*')">*</button>
        </div>
        <!-- 2nd row button ends-->
        <!-- 3rd row button starts-->
        <div class="cal_buttons">
            <button onclick="handleShowInput('7')">7</button>
            <button onclick="handleShowInput('8')">8</button>
            <button onclick="handleShowInput('9')">9</button>
            <button onclick="handleShowInput('-')">-</button>
        </div>
        <!-- 3rd row button ends-->
        <!-- 4th row button starts-->
        <div class="cal_buttons">
            <button onclick="handleShowInput('0')">0</button>
            <button onclick="handleShowInput('.')">.</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="handleShowInput('+')">+</button>
        </div>
        <!-- 4th row button ends-->
    </div>
    <script src="./src/index.js"></script>
</body>
</html>
