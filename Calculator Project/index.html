<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Project</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="calcutor_div">
        <!-- input + clear button starts-->
        <div class="inputBox_clearBtn">
            <div>
                <input type="number" name="input_box" id="input_box" placeholder="Enter numbers">
            </div>
            <button>
                C
            </button>
        </div>
        <!-- input + clear button ends-->
        <!-- 1st row button starts-->
        <div class="cal_buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>/</button>
        </div>
        <!-- 1st row button ends-->
        <!-- 2nd row button starts-->
        <div class="cal_buttons">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
        </div>
        <!-- 2nd row button ends-->
        <!-- 3rd row button starts-->
        <div class="cal_buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>
        </div>
        <!-- 3rd row button ends-->
        <!-- 4th row button starts-->
        <div class="cal_buttons">
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>
        </div>
        <!-- 4th row button ends-->
    </div>
    <script src="./src/index.js"></script>
</body>
</html>
