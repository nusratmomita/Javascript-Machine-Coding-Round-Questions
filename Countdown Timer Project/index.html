<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div>
        <h3 class="countdown_title">Countdown Timer</h3>
        <div>
            <div class="countdown_body">
                <div>
                    <h4 class="time_name">Hours</h4>
                    <div class="time_value">
                        <input type="number" placeholder="00" maxlength="2" class="time_hour"/>
                        <!-- <h3 class="time_colon">:</h3> -->
                    </div>
                </div>
                <div>
                    <h4 class="time_name">Minutes</h4>
                    <div class="time_value">
                        <input type="number" placeholder="00" maxlength="2" class="time_minute"/>
                        <!-- <h3 class="time_colon">:</h3> -->
                    </div>
                </div>
                <div>
                    <h4 class="time_name">Seconds</h4>
                    <input type="number" placeholder="00" maxlength="2" class="time_second"/>
                </div>
            </div>
            <button class="btn_start">Start</button>
            <button class="btn_stop">Stop</button>
            <button class="btn_reset">Reset</button>
        </div>
    </div>
    <script src="./src/index.js"></script>
</body>
</html>
