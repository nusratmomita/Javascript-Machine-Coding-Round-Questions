<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Managment</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/2c4593a4a7.js" crossorigin="anonymous"></script>
</head>
<body class="px-20 mb-20">
    <h3 class="text-3xl font-semibold mt-10">Employee Database Management</h3>
    <!-- employee section starts -->
    <div class="border border-black p-3 mt-8 flex">
        <!-- left section starts -->
        <div class="w-[30%] overflow-y-scroll h-100 pr-5 border-r-2 border-black" id="employee_section">
            <h4 class="text-center border-b border-black pb-3">Employee List</h4>
            <div id="list_of_employees" class="mt-3">
    
            </div>
        </div>
        <!-- left section ends -->
        <!-- right section starts-->
        <div class="w-[70%]">
            <h4 class="text-center border-b border-black ml-3 pb-3">Employee List</h4>
            <div id="single_employee_details"></div>
        </div>
        <!-- right section ends-->
    </div>
    <!-- employee section ends -->
    <script src="./index.js"></script>
</body>
</html>
